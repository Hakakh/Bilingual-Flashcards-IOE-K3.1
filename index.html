ink your milk, please.", vietnamese: "Làm ơn uống sữa của con đi." } ] },

            { title: '23. Festivals & Holidays 🎉', pairs: [ { english: "Tet is a big festival in Vietnam.", vietnamese: "Tết là lễ hội lớn ở Việt Nam." }, { english: "We have a long holiday in summer.", vietnamese: "Chúng tôi có kỳ nghỉ dài vào mùa hè." }, { english: "We decorate our house at Tet.", vietnamese: "Chúng tôi trang trí nhà vào dịp Tết." }, { english: "Lunar New Year is in January or February.", vietnamese: "Tết Âm lịch vào tháng Một hoặc Hai." }, { english: "Happy New Year!", vietnamese: "Chúc mừng năm mới!" }, { english: "We visit friends on New Year's Day.", vietnamese: "Chúng tôi đi thăm bạn bè vào ngày đầu năm." }, { english: "We have a Christmas tree.", vietnamese: "Chúng tôi có cây thông Noel." }, { english: "Christmas Day is on December 25th.", vietnamese: "Giáng sinh là ngày 25 tháng 12." }, { english: "We paint eggs at Easter.", vietnamese: "Chúng tôi tô trứng vào lễ Phục sinh." }, { english: "We wear costumes at Halloween.", vietnamese: "Chúng tôi mặc trang phục hóa trang vào Halloween." }, { english: "Children carry lanterns at the Mid-Autumn Festival.", vietnamese: "Trẻ em rước đèn vào Tết Trung thu." }, { english: "We get gifts on Children's Day.", vietnamese: "Chúng tôi nhận quà vào Ngày Quốc tế Thiếu nhi." }, { english: "We give flowers on Teacher's Day.", vietnamese: "Chúng tôi tặng hoa vào Ngày Nhà giáo." }, { english: "We love our moms on Women's Day.", vietnamese: "Chúng tôi yêu mẹ vào Ngày Phụ nữ." }, { english: "Independence Day is on September 2nd.", vietnamese: "Quốc khánh là ngày 2 tháng 9." }, { english: "I get a cake on my birthday.", vietnamese: "Tôi có bánh sinh nhật vào ngày sinh nhật." }, { english: "They have a big wedding party.", vietnamese: "Họ có một tiệc cưới lớn." }, { english: "We have a party on Sunday.", vietnamese: "Chúng tôi tổ chức tiệc vào Chủ nhật." }, { english: "We watch fireworks on New Year's Eve.", vietnamese: "Chúng tôi xem pháo hoa vào đêm Giao thừa." }, { english: "We watch fireworks at Tet.", vietnamese: "Chúng tôi xem pháo hoa vào Tết." }, { english: "We decorate our classroom.", vietnamese: "Chúng tôi trang trí lớp học." }, { english: "The decorations are beautiful.", vietnamese: "Những đồ trang trí thật đẹp." }, { english: "I carry a lantern at Mid-Autumn Festival.", vietnamese: "Tôi rước đèn lồng vào Tết Trung thu." }, { english: "I get gifts from my parents.", vietnamese: "Tôi nhận quà từ bố mẹ." }, { english: "I give a present to my friend.", vietnamese: "Tôi tặng quà cho bạn mình." }, { english: "I make a card for my teacher.", vietnamese: "Tôi làm thiệp cho cô giáo." }, { english: "We give flowers on holidays.", vietnamese: "Chúng tôi tặng hoa vào ngày lễ." }, { english: "We eat cake at parties.", vietnamese: "Chúng tôi ăn bánh trong bữa tiệc." }, { english: "Children eat candies at festivals.", vietnamese: "Trẻ em ăn kẹo trong lễ hội." }, { english: "We sing New Year songs.", vietnamese: "Chúng tôi hát bài hát năm mới." }, { english: "We dance at the party.", vietnamese: "Chúng tôi nhảy trong bữa tiệc." }, { english: "We watch the parade on TV.", vietnamese: "Chúng tôi xem diễu hành trên TV." }, { english: "Children wear masks at Halloween.", vietnamese: "Trẻ em đeo mặt nạ vào Halloween." }, { english: "She wears a witch costume.", vietnamese: "Cô ấy mặc trang phục phù thủy." }, { english: "We light candles on the cake.", vietnamese: "Chúng tôi thắp nến trên bánh." }, { english: "I wish you happiness!", vietnamese: "Tôi chúc bạn hạnh phúc!" }, { english: "Happy birthday to you!", vietnamese: "Chúc mừng sinh nhật bạn!" }, { english: "We celebrate Tet with our family.", vietnamese: "Chúng tôi ăn mừng Tết với gia đình." }, { english: "The celebration is fun.", vietnamese: "Buổi lễ thật vui." }, { english: "We visit our relatives at Tet.", vietnamese: "Chúng tôi thăm họ hàng vào Tết." }, { english: "I get lucky money at Tet.", vietnamese: "Tôi nhận lì xì vào Tết." }, { english: "The lucky money is in a red envelope.", vietnamese: "Tiền lì xì ở trong bao đỏ         ];

        // --- Components ---
        const SpeakerIcon = ({ className }) => (
            React.createElement('svg', { xmlns: "http://www.w3.org/2000/svg", className: className || "h-6 w-6", fill: "none", viewBox: "0 0 24 24", stroke: "currentColor", strokeWidth: 2 },
                React.createElement('path', { strokeLinecap: "round", strokeLinejoin: "round", d: "M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" })
            )
        );

        const App = () => {
            const [appState, setAppState] = useState(AppState.SELECT_TOPIC);
            const [selectedTopic, setSelectedTopic] = useState(null);

            const [sentences, setSentences] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [gameState, setGameState] = useState(GameState.READ);
            const [isSpeaking, setIsSpeaking] = useState(false);
            
            // Interaction State
            const [isTranslationRevealed, setIsTranslationRevealed] = useState(false);
            
            // Voice selection state
            const [voices, setVoices] = useState([]);
            const [selectedVoiceURI, setSelectedVoiceURI] = useState(null);
            
            const canSpeak = 'speechSynthesis' in window;

            useEffect(() => {
                const loadVoices = () => {
                    const availableVoices = window.speechSynthesis.getVoices();
                    // Filter for English voices
                    const enVoices = availableVoices.filter(v => v.lang.startsWith('en'));
                    setVoices(enVoices);
                    // Default to the first English voice if none selected
                    if (enVoices.length > 0 && !selectedVoiceURI) {
                        // Prefer Google US English or similar high quality voices if available
                        const preferred = enVoices.find(v => v.name.includes("Google US English")) || enVoices[0];
                        setSelectedVoiceURI(preferred.voiceURI);
                    }
                };
                
                loadVoices();
                if (window.speechSynthesis.onvoiceschanged !== undefined) {
                    window.speechSynthesis.onvoiceschanged = loadVoices;
                }
            }, [selectedVoiceURI]);

            const shuffleSentences = useCallback((pairs) => {
                return [...pairs].sort(() => Math.random() - 0.5);
            }, []);

            const currentPair = useMemo(() => {
                if (sentences.length === 0) {
                    return { english: 'Loading...', vietnamese: 'Đang tải...', englishWithEmoji: 'Loading...' };
                }
                const pair = sentences[currentIndex];
                return {
                    ...pair,
                    englishWithEmoji: `${pair.english} ${getEmojiForSentence(pair.english)}`
                };
            }, [sentences, currentIndex]);

            const handleSpeak = useCallback((textToSpeak) => {
                if (canSpeak && textToSpeak && textToSpeak !== 'Loading...') {
                    // This regex removes a wide range of emojis and symbols.
                    const emojiAndSymbolsRegex = /([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD10-\uDDFF])/g;
                    
                    // Also remove specific non-English words that are in the data.
                    const nonEnglishWords = ['休憩', 'ภูมิใจ', '칠판'];
                    const nonEnglishWordsRegex = new RegExp(nonEnglishWords.join('|'), 'gi');

                    const cleanText = textToSpeak
                        .replace(emojiAndSymbolsRegex, '')
                        .replace(nonEnglishWordsRegex, '')
                        .replace(/  +/g, ' ') // Collapse multiple spaces
                        .trim();

                    const utterance = new SpeechSynthesisUtterance(cleanText);
                    utterance.lang = 'en-US';
                    
                    if (selectedVoiceURI) {
                        const voice = voices.find(v => v.voiceURI === selectedVoiceURI);
                        if (voice) utterance.voice = voice;
                    }

                    utterance.onstart = () => setIsSpeaking(true);
                    utterance.onend = () => setIsSpeaking(false);
                    utterance.onerror = () => setIsSpeaking(false);
                    window.speechSynthesis.cancel();
                    window.speechSynthesis.speak(utterance);
                }
            }, [canSpeak, voices, selectedVoiceURI]);

            const handleTopicSelect = useCallback((topic) => {
                setSelectedTopic(topic);
                setSentences(shuffleSentences(topic.pairs));
                setCurrentIndex(0);
                setGameState(GameState.READ);
                setIsTranslationRevealed(false);
                setAppState(AppState.PLAY_GAME);
            }, [shuffleSentences]);

            const handleBackToTopics = useCallback(() => {
                setAppState(AppState.SELECT_TOPIC);
                setSelectedTopic(null);
                setSentences([]);
                setIsTranslationRevealed(false);
            }, []);
            
            const handleRestart = useCallback(() => {
                if (selectedTopic) {
                    setSentences(shuffleSentences(selectedTopic.pairs));
                    setCurrentIndex(0);
                    setGameState(GameState.READ);
                    setIsTranslationRevealed(false);
                }
            }, [selectedTopic, shuffleSentences]);

            const handleNextAction = useCallback(() => {
                window.speechSynthesis.cancel();
                setIsTranslationRevealed(false);
                if (gameState === GameState.READ) {
                    setGameState(GameState.TRANSLATE);
                } else if (gameState === GameState.TRANSLATE) {
                    setGameState(GameState.REVEAL);
                } else if (gameState === GameState.REVEAL) {
                    if (currentIndex === sentences.length - 1) {
                        setGameState(GameState.COMPLETE);
                    } else {
                        setCurrentIndex((prevIndex) => prevIndex + 1);
                        setGameState(GameState.READ);
                    }
                }
            }, [gameState, sentences.length, currentIndex]);

            const handlePrevAction = useCallback(() => {
                window.speechSynthesis.cancel();
                setIsTranslationRevealed(false);
                if (gameState === GameState.REVEAL) {
                    setGameState(GameState.TRANSLATE);
                } else if (gameState === GameState.TRANSLATE) {
                    setGameState(GameState.READ);
                } else if (gameState === GameState.READ) {
                    if (currentIndex > 0) {
                        setCurrentIndex(prev => prev - 1);
                        setGameState(GameState.REVEAL);
                    }
                }
            }, [gameState, currentIndex]);
            
            const renderTopicSelection = () => (
                React.createElement('div', { className: "w-full max-w-6xl mx-auto animate-fade-in" },
                    React.createElement('header', { className: "text-center py-8" },
                        React.createElement('h1', { className: "text-3xl sm:text-4xl font-bold text-sky-800" }, "Bilingual Flashcards 🇻🇳🇬🇧"),
                        React.createElement('p', { className: "text-lg text-slate-600 mt-2" }, "Choose a topic to start practicing!")
                    ),
                    React.createElement('div', { className: "grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4" },
                        TOPICS_DATA.map(topic => (
                            React.createElement('button', {
                                key: topic.title,
                                onClick: () => handleTopicSelect(topic),
                                className: "bg-white/70 backdrop-blur-md p-4 rounded-lg shadow-md hover:shadow-xl text-slate-800 font-semibold text-center transition-all duration-300 ease-in-out transform hover:-translate-y-1 hover:scale-105"
                            }, topic.title)
                        ))
                    )
                )
            );

            const renderGame = () => {
                const progress = sentences.length > 0 ? ((currentIndex + 1) / sentences.length) * 100 : 0;
                const progressText = sentences.length > 0 ? `${currentIndex + 1} / ${sentences.length}` : '0 / 0';
                const nextButtonText = (() => {
                     switch (gameState) {
                        case GameState.READ: return "Practice Translation ✍️";
                        case GameState.TRANSLATE: return "Show English Answer 👀";
                        case GameState.REVEAL: return "Next Sentence →";
                        default: return "Next";
                    }
                })();
                
                const showBackButton = !(gameState === GameState.READ && currentIndex === 0) && gameState !== GameState.COMPLETE;

                return (
                    React.createElement('div', { className: "w-full max-w-4xl flex-grow flex flex-col animate-fade-in" },
                        React.createElement('header', { className: "text-center py-4 relative flex flex-col md:flex-row items-center justify-between" },
                             React.createElement('button', {
                                onClick: handleBackToTopics,
                                className: "mb-2 md:mb-0 text-indigo-600 hover:text-indigo-800 font-semibold transition-colors duration-200 p-2 rounded-md hover:bg-indigo-100"
                            }, "← Change Topic"),
                            
                            React.createElement('div', { className: "text-center" },
                                React.createElement('h1', { className: "text-2xl sm:text-3xl font-bold text-sky-800" }, selectedTopic?.title || "Bilingual Flashcards"),
                                React.createElement('p', { className: "text-md text-slate-600 mt-1" }, "English & Vietnamese Practice")
                            ),

                            // Voice Selector
                            canSpeak && React.createElement('div', { className: "mt-2 md:mt-0 flex items-center bg-white/50 rounded-lg p-1" },
                                React.createElement('label', { htmlFor: "voice-select", className: "sr-only" }, "Select Voice"),
                                React.createElement('select', {
                                    id: "voice-select",
                                    value: selectedVoiceURI || '',
                                    onChange: (e) => setSelectedVoiceURI(e.target.value),
                                    className: "text-sm border-none bg-transparent focus:ring-0 text-slate-700 font-medium max-w-[150px] truncate cursor-pointer"
                                }, 
                                    voices.map(voice => React.createElement('option', { key: voice.voiceURI, value: voice.voiceURI }, voice.name))
                                )
                            )
                        ),
                        
                        React.createElement('div', { className: "w-full my-4" },
                            React.createElement('div', { className: "flex justify-between items-center text-sm text-slate-600 mb-1 px-1" },
                                React.createElement('span', null, "Progress"),
                                React.createElement('span', { className: "font-medium" }, gameState === GameState.COMPLETE ? `Complete! 🎉` : progressText)
                            ),
                            React.createElement('div', { className: "w-full h-3 bg-slate-300/80 rounded-full overflow-hidden" },
                                React.createElement('div', {
                                    className: "h-full bg-gradient-to-r from-sky-400 to-indigo-500 transition-all duration-500 ease-out",
                                    style: { width: `${gameState === GameState.COMPLETE ? 100 : progress}%` }
                                })
                            )
                        ),

                        React.createElement('div', { className: "flex-grow flex items-center justify-center" },
                            React.createElement('div', { className: "bg-white/70 backdrop-blur-md rounded-2xl shadow-lg p-6 sm:p-10 md:p-12 w-full text-center flex flex-col justify-center min-h-[350px] md:min-h-[450px]" },
                                gameState === GameState.READ && (
                                    React.createElement('div', { className: "space-y-6 animate-fade-in" },
                                        React.createElement('div', null,
                                            React.createElement('p', { className: "text-sm font-medium text-indigo-600 mb-2" }, "READ (Tiếng Anh) 🧐"),
                                            React.createElement('div', { className: "flex items-center justify-center gap-x-4" },
                                                React.createElement('p', { className: "text-3xl md:text-5xl font-semibold text-slate-900" }, currentPair.englishWithEmoji),
                                                canSpeak && React.createElement('button', { onClick: () => handleSpeak(currentPair.english), disabled: isSpeaking, className: `p-3 rounded-full transition-all duration-200 disabled:cursor-wait ${isSpeaking ? 'text-sky-600 bg-sky-100 animate-pulse' : 'text-slate-500 hover:bg-sky-100'}`, 'aria-label': "Read sentence aloud" }, React.createElement(SpeakerIcon, { className: "h-7 w-7" }))
                                            )
                                        ),
                                        React.createElement('hr', { className: "border-slate-300 w-1/4 mx-auto" }),
                                        React.createElement('div', { className: "relative" },
                                            React.createElement('div', { className: "flex items-center justify-center gap-2 mb-2" },
                                                React.createElement('p', { className: "text-sm text-slate-500" }, "TRANSLATION (Tiếng Việt)"),
                                                React.createElement('button', {
                                                    onClick: () => setIsTranslationRevealed(!isTranslationRevealed),
                                                    className: "text-slate-400 hover:text-indigo-500 transition-colors",
                                                    title: "Toggle Translation"
                                                }, isTranslationRevealed ? "👁️" : "🙈")
                                            ),
                                            React.createElement('div', { 
                                                className: `cursor-pointer transition-all duration-300 ${isTranslationRevealed ? 'filter-none opacity-100' : 'blur-md opacity-60 hover:opacity-80 select-none'}`,
                                                onClick: () => setIsTranslationRevealed(true),
                                                title: "Click to reveal"
                                            },
                                                React.createElement('p', { className: "text-xl md:text-3xl text-slate-700" }, currentPair.vietnamese)
                                            ),
                                            !isTranslationRevealed && React.createElement('p', { className: "text-xs text-slate-400 mt-2 animate-pulse" }, "(Click text to reveal)")
                                        )
                                    )
                                ),
                                gameState === GameState.TRANSLATE && (
                                    React.createElement('div', { className: "space-y-4 animate-fade-in" },
                                        React.createElement('p', { className: "text-sm font-medium text-indigo-600 mb-2" }, "TRANSLATE THIS TO ENGLISH ✍️"),
                                        React.createElement('p', { className: "text-3xl md:text-5xl font-semibold text-slate-900" }, currentPair.vietnamese)
                                    )
                                ),
                                gameState === GameState.REVEAL && (
                                     React.createElement('div', { className: "space-y-6 animate-fade-in" },
                                        React.createElement('div', null,
                                            React.createElement('p', { className: "text-sm text-slate-500 mb-2" }, "YOUR SENTENCE (Tiếng Việt)"),
                                            React.createElement('p', { className: "text-xl md:text-3xl text-slate-700" }, currentPair.vietnamese)
                                        ),
                                        React.createElement('hr', { className: "border-slate-300 w-1/4 mx-auto" }),
                                        React.createElement('div', null,
                                            React.createElement('p', { className: "text-sm font-medium text-indigo-600 mb-2" }, "CORRECT ANSWER (Tiếng Anh) ✅"),
                                             React.createElement('div', { className: "flex items-center justify-center gap-x-4" },
                                                React.createElement('p', { className: "text-3xl md:text-5xl font-semibold text-slate-900" }, currentPair.englishWithEmoji),
                                                canSpeak && React.createElement('button', { onClick: () => handleSpeak(currentPair.english), disabled: isSpeaking, className: `p-3 rounded-full transition-all duration-200 disabled:cursor-wait ${isSpeaking ? 'text-sky-600 bg-sky-100 animate-pulse' : 'text-slate-500 hover:bg-sky-100'}`, 'aria-label': "Read sentence aloud" }, React.createElement(SpeakerIcon, { className: "h-7 w-7" }))
                                            )
                                        )
                                    )
                                ),
                                gameState === GameState.COMPLETE && (
                                     React.createElement('div', { className: "space-y-4 animate-fade-in text-center" },
                                        React.createElement('p', { className: "text-6xl md:text-7xl" }, "🎉"),
                                        React.createElement('h2', { className: "text-3xl md:text-4xl font-bold text-sky-800" }, "Topic Complete!"),
                                        React.createElement('p', { className: "text-lg text-slate-600" }, "You've finished all sentences for this topic."),
                                        React.createElement('div', { className: "flex flex-col sm:flex-row items-center justify-center gap-4 mt-8" },
                                            React.createElement('button', {
                                                onClick: handleRestart,
                                                className: "w-full sm:w-auto bg-indigo-500 hover:bg-indigo-600 text-white font-bold text-lg py-3 px-6 rounded-full shadow-lg hover:shadow-indigo-500/50 transform hover:-translate-y-1 transition-all duration-300 ease-in-out focus:outline-none focus:ring-4 focus:ring-indigo-300"
                                            }, "Play Topic Again 🔄"),
                                            React.createElement('button', {
                                                onClick: handleBackToTopics,
                                                className: "w-full sm:w-auto bg-sky-500 hover:bg-sky-600 text-white font-bold text-lg py-3 px-6 rounded-full shadow-lg hover:shadow-sky-500/50 transform hover:-translate-y-1 transition-all duration-300 ease-in-out focus:outline-none focus:ring-4 focus:ring-sky-300"
                                            }, "Choose Another Topic 📚")
                                        )
                                     )
                                )
                            )
                        ),

                        React.createElement('div', { className: "sticky bottom-0 py-4 mt-auto bg-slate-100/50 backdrop-blur-sm -mx-4 px-4 sm:-mx-6 sm:px-6 flex gap-4" },
                            showBackButton && React.createElement('button', {
                                onClick: handlePrevAction,
                                className: "flex-1 bg-slate-300 hover:bg-slate-400 text-slate-700 font-bold text-lg py-4 px-6 rounded-full shadow-lg hover:shadow-slate-400/50 transform hover:-translate-y-1 transition-all duration-300 ease-in-out focus:outline-none focus:ring-4 focus:ring-slate-300"
                            }, "← Back"),
                            gameState !== GameState.COMPLETE && React.createElement('button', {
                                onClick: handleNextAction,
                                disabled: sentences.length === 0,
                                className: "flex-[2] bg-indigo-500 hover:bg-indigo-600 disabled:bg-slate-400 disabled:cursor-not-allowed text-white font-bold text-lg py-4 px-8 rounded-full shadow-lg hover:shadow-indigo-500/50 transform hover:-translate-y-1 transition-all duration-300 ease-in-out focus:outline-none focus:ring-4 focus:ring-indigo-300"
                            }, nextButtonText)
                        )
                    )
                );
            }

            return (
                React.createElement('main', { className: "min-h-screen bg-gradient-to-br from-slate-100 to-sky-200 text-slate-800 flex flex-col items-center justify-center p-4 sm:p-6 font-sans" },
                   appState === AppState.SELECT_TOPIC ? renderTopicSelection() : renderGame()
                )
            );
        };
        
        const rootElement = document.getElementById('root');
        if (!rootElement) {
          throw new Error("Could not find root element to mount to");
        }

        const root = ReactDOM.createRoot(rootElement);
        root.render(
          React.createElement(React.StrictMode, null, React.createElement(App, null))
        );
    </script>
</body>
</html>
